<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rina's Portfolio</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="scene">
			<!-- Bag sits in the center -->
			<img src="images/bag.png" alt="Bag" class="item bag" id="bag" />

			<!-- Scattered items around the bag -->
			<img src="images/mirror.png" alt="Mirror" class="item pos-mirror" />
			<img src="images/hairclip.png" alt="Hair clip" class="item pos-hairclip" />
			<img src="images/sunglasses.png" alt="Sunglasses" class="item pos-sunglasses" />
			<img src="images/headphones.png" alt="Headphones" class="item pos-headphones" />
			<img src="images/wallet.png" alt="Wallet" class="item pos-wallet" />
			<img src="images/camera.png" alt="Camera" class="item pos-camera" />
			<img src="images/parfume.png" alt="Perfume" class="item pos-parfume" />
			<img src="images/lipgloss.png" alt="Lip gloss" class="item pos-lipgloss" />
			<img src="images/lipglosstwoo.png" alt="Lip gloss" class="item pos-lipglosstwoo" />
			<img src="images/keychainone.png" alt="Keychain" class="item pos-keychainone" />
			<img src="images/keychaintwoo.png" alt="Keychain" class="item pos-keychaintwoo" />
			<img src="images/keychainthree.png" alt="Keychain" class="item pos-keychainthree" />
			<img src="images/keychainfour.png" alt="Keychain" class="item pos-keychainfour" />
		</main>
	</body>
</html>
